name: OWASP Dependency Check

on:
  push:
    branches:
      - main

jobs:
  dependency-check:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "SecureCorp"
          path: "."
          format: "HTML"
